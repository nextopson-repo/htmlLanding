<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Nextdeal | Marketing Payment Link Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-lg p-6 space-y-6">

        <!-- Header -->
        <div class="text-center">
            <h1 class="text-2xl font-semibold text-gray-900">Marketing Payment Link</h1>
            <p class="text-gray-500 text-sm mt-1">Generate Razorpay payment links for customers</p>
        </div>

        <!-- Mobile -->
        <div class="space-y-1">
            <label class="text-xs font-medium text-gray-700">CUSTOMER MOBILE NUMBER <span class="text-red-500">*</span></label>
            <div class="flex items-center border border-gray-300 rounded-xl overflow-hidden bg-white">
                <span class="px-3 text-xs text-gray-500 border-r border-gray-200 bg-gray-50">+91</span>
                <input id="mobileInput" maxlength="10" type="tel"
                    class="w-full px-3 py-2.5 text-sm outline-none bg-transparent"
                    placeholder="Enter 10 digit number" />
            </div>
        </div>

        <!-- Plan Selection -->
        <div class="space-y-2">
            <label class="text-xs font-medium text-gray-700">SELECT PLAN</label>

            <div class="grid grid-cols-2 gap-3">

                <!-- Premium -->
                <button data-plan="premium" id="premiumCard"
                    class="plan-card border border-blue-500 bg-blue-50 rounded-xl px-4 py-3 text-left transition ring-2 ring-blue-300/50">
                    <p class="font-semibold text-sm text-gray-900">Premium</p>
                    <p class="text-green-600 font-bold text-lg">₹999</p>
                </button>

                <!-- mPremium -->
                <button data-plan="mpremium" id="mpremiumCard"
                    class="plan-card border border-gray-300 bg-white rounded-xl px-4 py-3 text-left transition hover:border-amber-400 hover:bg-amber-50/40">
                    <p class="font-semibold text-sm text-gray-900">mPremium</p>
                    <p class="text-green-600 font-bold text-lg">₹499</p>
                </button>

            </div>
        </div>

        <!-- Error Message -->
        <div id="errorBox"
            class="hidden text-xs text-red-600 bg-red-50 border border-red-200 rounded-xl px-3 py-2"></div>

        <!-- Success Box -->
        <div id="successBox"
            class="hidden text-xs text-green-700 bg-green-50 border border-green-200 rounded-xl px-3 py-2"></div>

        <!-- Generate Button -->
        <button id="generateBtn"
            class="w-full inline-flex items-center justify-center gap-2 rounded-full bg-blue-600 text-white text-sm font-semibold py-3 shadow-md hover:bg-blue-700 transition disabled:opacity-60">
            <i class="fa-solid fa-link"></i>
            <span>Generate Payment Link</span>
        </button>

        <!-- Generated Link Box -->
        <div id="linkContainer" class="hidden mt-4">
            <p class="text-xs font-medium text-gray-600 mb-1">Generated Link:</p>

            <div class="flex items-center border border-gray-300 rounded-xl overflow-hidden bg-white">
                <input id="paymentLink" type="text"
                    class="w-full px-3 py-2 text-sm bg-transparent outline-none" readonly />
                <button id="copyBtn"
                    class="px-4 bg-blue-600 text-white text-sm font-semibold h-full hover:bg-blue-700">
                    Copy
                </button>
            </div>
        </div>

    </div>


    <!-- SCRIPT -->
    <script>
        const BACKEND_URL = "https://nextopson.com/api/v1/payment/create-marketing-link"; 

        const mobileInput = document.getElementById("mobileInput");
        const generateBtn = document.getElementById("generateBtn");
        const premiumCard = document.getElementById("premiumCard");
        const mpremiumCard = document.getElementById("mpremiumCard");
        const errorBox = document.getElementById("errorBox");
        const successBox = document.getElementById("successBox");
        const linkContainer = document.getElementById("linkContainer");
        const paymentLinkInput = document.getElementById("paymentLink");
        const copyBtn = document.getElementById("copyBtn");

        let selectedPlan = "premium";

        // ---------------------
        // PLAN SELECTION LOGIC
        // ---------------------
        document.querySelectorAll(".plan-card").forEach(card => {
            card.addEventListener("click", () => {
                document.querySelectorAll(".plan-card").forEach(c => {
                    c.classList.remove("ring-2", "ring-blue-300/50", "border-blue-500", "bg-blue-50");
                    c.classList.add("border-gray-300", "bg-white");
                });

                card.classList.add("ring-2", "ring-blue-300/50", "border-blue-500", "bg-blue-50");
                selectedPlan = card.getAttribute("data-plan");
            });
        });

        // ---------------------
        // HELPER FUNCTIONS
        // ---------------------
        function showError(msg) {
            errorBox.classList.remove("hidden");
            errorBox.textContent = msg;
        }
        function hideError() {
            errorBox.classList.add("hidden");
        }

        function showSuccess(msg) {
            successBox.classList.remove("hidden");
            successBox.textContent = msg;
        }
        function hideSuccess() {
            successBox.classList.add("hidden");
        }

        function validateMobile(number) {
            return /^[6-9]\d{9}$/.test(number);
        }

        // ---------------------
        // GENERATE PAYMENT LINK
        // ---------------------
        generateBtn.addEventListener("click", async () => {
            hideError();
            hideSuccess();
            linkContainer.classList.add("hidden");

            const mobile = mobileInput.value.trim();

            if (!validateMobile(mobile)) {
                showError("Please enter a valid 10-digit Indian mobile number.");
                return;
            }

            generateBtn.disabled = true;
            generateBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Generating...`;

            try {
                const res = await fetch(BACKEND_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        mobileNumber: mobile,
                        plan: selectedPlan
                    })
                });

                const data = await res.json();

                if (!data.success) {
                    showError(data.message || "Failed to generate link.");
                    generateBtn.disabled = false;
                    generateBtn.innerHTML = `<i class="fa-solid fa-link"></i> Generate Payment Link`;
                    return;
                }

                // Show generated link
                paymentLinkInput.value = data.data.paymentLink;
                linkContainer.classList.remove("hidden");
                showSuccess("Payment link generated successfully!");

            } catch (err) {
                showError("Server error. Please try again.");
            }

            generateBtn.disabled = false;
            generateBtn.innerHTML = `<i class="fa-solid fa-link"></i> Generate Payment Link`;
        });

        // ---------------------
        // COPY BUTTON
        // ---------------------
        copyBtn.addEventListener("click", () => {
            paymentLinkInput.select();
            document.execCommand("copy");
            showSuccess("Copied to clipboard!");
        });
    </script>

</body>
</html>
